name: Build and Push Components as Docker Images

on:
  push:
    branches:
      - main
    paths:
      - '.devcontainer/**'

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  filter:
    name: Determine service based on changed directories
    runs-on: ubuntu-latest
    outputs:
      changes: ${{ steps.set-service.outputs.changes }}
    steps:
      - uses: actions/checkout@v5
      - name: Set up paths filter
        id: set-service
        uses: dorny/paths-filter@v3
        with:
          filters: |
            novnc:
              - '.devcontainer/novnc/**'
            devcontainer:
              - '.devcontainer/devcontainer/**'
            else:
              - '.devcontainer/compose.yaml'
              - '.devcontainer/blender/**'
  build-push:
    name: Build and push container image
    needs: filter
    runs-on: ubuntu-latest
    strategy:
      matrix: 
        service: ${{ fromJson(needs.filter.outputs.changes) }}
    env:
      SERVICE: ${{ matrix.service }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: image build (blender - all)
        if: ${{ env.SERVICE == 'else' }}
        run: |
          docker compose -f .devcontainer/compose.yaml build
          docker compose -f .devcontainer/compose.yaml push
      - name: image build (service)
        if: ${{ env.SERVICE != 'else' }}
        run: |
          docker compose -f .devcontainer/compose.yaml build ${{ env.SERVICE }}
          docker compose -f .devcontainer/compose.yaml push ${{ env.SERVICE }}