name: Create release

on:
  push:
    tags:
      - 'v*.*.0'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    env: 
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: create release
        run: |
          gh release create  ${{ github.ref_name }} --title  ${{ github.ref_name }} --generate-notes